server {
  listen 80;
  root /usr/share/nginx/html;

  location = / { try_files /index.html =404; }
  location = /logo.webp { try_files /logo.webp =404; }

  location = /install.sh {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache";
    try_files /install.sh =404;
  }

  location = /RafaDesk.exe {
    alias /data/RafaDesk-1.5.1.exe;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="RafaDesk-1.5.1.exe"';
  }

  location = /RafaDesk.deb {
    alias /data/RafaDesk-1.5.1-x86_64.deb;
    default_type application/vnd.debian.binary-package;
    add_header Content-Disposition 'attachment; filename="RafaDesk-1.5.1-x86_64.deb"';
  }

  location = /RafaDesk.apk {
    alias /data/RafaDesk-1.5.1.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="RafaDesk-1.5.1.apk"';
  }

  location / { return 404; }
}
